server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/boutique_beauty}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:boutique_beauty}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:240000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_TIME_MS:120000}
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.supabase.issuer-uri=${SUPABASE_ISSUER_URI:}
app.supabase.jwks-uri=${SUPABASE_JWKS_URI:}
app.supabase.audience=${SUPABASE_AUDIENCE:authenticated}
app.supabase.url=${SUPABASE_URL:}
app.supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:product-images}
app.supabase.storage.secret-key=${SUPABASE_SECRET_KEY:}
app.supabase.storage.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.bootstrap.admin-user-id=${BOOTSTRAP_ADMIN_USER_ID:}
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
