server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/muse_beauty}
spring.datasource.username=${DATABASE_USERNAME:muse}
spring.datasource.password=${DATABASE_PASSWORD:change-me}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.session.ttl-hours=${SESSION_TTL_HOURS:24}
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
